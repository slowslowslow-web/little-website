<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>untitled - Paint</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- SAME SITE RUG -->

    <div class="rug top"></div>
    <div class="rug bottom"></div>
    <div class="rug left"></div>
    <div class="rug right"></div>


    <main class="paint-page">


        <section class="paint-room">


            <!-- OLD PC WINDOW -->

            <div class="paint-window">


                <!-- TITLE BAR -->

                <div class="paint-titlebar">

                    <div class="paint-title">
                        untitled - Paint
                    </div>

                    <div class="paint-buttons">

                        <div class="paint-button">
                            _
                        </div>

                        <div class="paint-button">
                            □
                        </div>

                        <div class="paint-button">
                            ×
                        </div>

                    </div>

                </div>


                <!-- ACTUAL PAINT -->

                <div class="paint-iframe-wrap">

                    <iframe
                        id="paintFrame"
                        class="paint-iframe"
                        title="JS Paint"
                        allow="clipboard-read; clipboard-write"
                    ></iframe>

                </div>


            </div>


            <!-- BACK -->

            <a
                href="index.html"
                class="paint-back"
            >
                ← back
            </a>


        </section>


    </main>


    <!-- LOAD OUR DOODLE INTO JS PAINT -->

    <script>

        const paintFrame =
            document.getElementById("paintFrame");

        const doodle =
            new URL("doodle.svg", window.location.href).href;

        paintFrame.src =
            "https://jspaint.app#load:" + doodle;

    </script>


</body>

</html>
