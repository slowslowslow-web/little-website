<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>gallery</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- SONG 1 -->
    <audio id="pageMusic" autoplay preload="auto" hidden>
        <source src="song1.mp3" type="audio/mpeg">
    </audio>


    <!-- THIN RUG BORDER -->

    <div class="rug top"></div>
    <div class="rug bottom"></div>
    <div class="rug left"></div>
    <div class="rug right"></div>


    <main class="page">

        <section class="center gallery-page">

            <div class="date">
                gallery
            </div>


            <!-- PHOTO PLACEHOLDER -->

            <div class="photo-placeholder">
                PHOTO
            </div>


            <div class="photo-number">
                01 / 01
            </div>


            <a href="index.html"
               class="back">

                ← back

            </a>

        </section>

    </main>


    <!-- AUTOPLAY FALLBACK -->

    <script>

        const music =
            document.getElementById("pageMusic");

        music.play().catch(() => {});

        document.addEventListener("click", () => {

            if (music.paused) {
                music.play().catch(() => {});
            }

        }, { once: true });

    </script>

</body>

</html>
