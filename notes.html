<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>note</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- SONG 2 -->
    <audio id="pageMusic" autoplay preload="auto" hidden>
        <source src="song2.mp3" type="audio/mpeg">
    </audio>


    <!-- THIN RUG BORDER -->

    <div class="rug top"></div>
    <div class="rug bottom"></div>
    <div class="rug left"></div>
    <div class="rug right"></div>


    <main class="page">

        <section class="center note-page">

            <div class="date">
                note
            </div>


            <!-- NOTE PLACEHOLDER -->

            <div class="note-paper">

                <p>
                    note goes here
                </p>

            </div>


            <a href="index.html"
               class="back">

                ← back

            </a>

        </section>

    </main>


    <!-- AUTOPLAY FALLBACK -->

    <script>

        const music =
            document.getElementById("pageMusic");

        music.play().catch(() => {});

        document.addEventListener("click", () => {

            if (music.paused) {
                music.play().catch(() => {});
            }

        }, { once: true });

    </script>

</body>

</html>
