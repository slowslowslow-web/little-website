
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .gallery-page {
            min-height: 100vh;
            box-sizing: border-box;
            padding: 70px 24px 60px;
            color: #b77acb;
        }

        .gallery-top {
            max-width: 900px;
            margin: 0 auto 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .gallery-top a,
        .gallery-back,
        .next-song {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            font: inherit;
        }

        .gallery-top a:hover,
        .gallery-back:hover,
        .next-song:hover {
            opacity: 0.65;
        }

        .gallery-heading {
            text-align: center;
            margin: 25px 0 40px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .album-grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .album-card {
            border: 1px solid rgba(183, 122, 203, 0.4);
            background: rgba(255, 255, 255, 0.12);
            color: inherit;
            cursor: pointer;
            padding: 14px;
            text-align: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
            min-width: 0;
            font: inherit;
        }

        .album-card:hover {
            transform: translateY(-4px);
        }

        .album-cover {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(183, 122, 203, 0.10);
            border: 1px solid rgba(183, 122, 203, 0.25);
            margin-bottom: 16px;
            font-size: 38px;
        }

        .album-title {
            font-size: 13px;
            letter-spacing: 1.5px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .album-view {
            display: none;
            max-width: 760px;
            margin: 0 auto;
        }

        .album-view.active {
            display: block;
        }

        .album-view-heading {
            text-align: center;
            font-weight: normal;
            letter-spacing: 2px;
            margin: 12px 0 30px;
            overflow-wrap: anywhere;
        }

        .album-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 0 auto 35px;
            flex-wrap: wrap;
        }

        .next-song {
            border: 1px solid rgba(183, 122, 203, 0.6);
            background: rgba(255, 255, 255, 0.12);
            padding: 9px 18px;
            border-radius: 0;
        }

        .song-counter {
            font-size: 13px;
            letter-spacing: 1px;
            min-width: 45px;
            text-align: center;
        }

        .diary-entry {
            margin: 0 auto 38px;
            text-align: center;
            max-width: 560px;
        }

        .diary-photo {
            display: block;
            max-width: 100%;
            width: auto;
            max-height: 620px;
            margin: 0 auto;
            cursor: zoom-in;
            object-fit: contain;
            border: 1px solid rgba(183, 122, 203, 0.25);
        }

        .diary-note {
            margin: 12px auto 0;
            font-size: 13px;
            letter-spacing: 0.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty-album {
            text-align: center;
            opacity: 0.75;
            padding: 40px 12px;
            line-height: 1.8;
        }

        .photo-lightbox {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(10, 8, 13, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            cursor: zoom-out;
        }

        .photo-lightbox.active {
            display: flex;
        }

        .photo-lightbox img {
            display: block;
            max-width: 95vw;
            max-height: 92vh;
            object-fit: contain;
            cursor: zoom-out;
        }

        @media (max-width: 650px) {
            .gallery-page {
                padding: 55px 20px 40px;
            }

            .album-grid {
                grid-template-columns: 1fr;
                max-width: 330px;
                gap: 20px;
            }

            .album-card {
                padding: 12px;
            }

            .album-cover {
                aspect-ratio: 4 / 3;
            }

            .diary-photo {
                max-height: 70vh;
                max-width: 100%;
            }

            .gallery-heading {
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- THIN RUG BORDER -->
    <div class="rug top"></div>
    <div class="rug bottom"></div>
    <div class="rug left"></div>
    <div class="rug right"></div>

    <main class="gallery-page">

        <!-- TOP NAVIGATION -->
        <header class="gallery-top">
            <a href="index.html" id="homeLink">← home</a>
            <a href="index.html" aria-label="Home">8</a>
        </header>

        <!-- ALBUM HUB -->
        <section id="albumHub">
            <h1 class="gallery-heading">gallery</h1>

            <div class="album-grid">

                <button class="album-card" type="button" data-album="me">
                    <div class="album-cover"><span>♡</span></div>
                    <div class="album-title">ME</div>
                </button>

                <button class="album-card" type="button" data-album="itsok">
                    <div class="album-cover"><span>☁</span></div>
                    <div class="album-title">IT'S OK NOT TO BE OK</div>
                </button>

                <button class="album-card" type="button" data-album="beauty">
                    <div class="album-cover"><span>✿</span></div>
                    <div class="album-title">BEAUTY</div>
                </button>

            </div>
        </section>

        <!-- ALBUM CONTENT -->
        <section id="albumView" class="album-view">

            <div class="gallery-top">
                <button type="button" class="gallery-back" id="backToAlbums">
                    ← albums
                </button>
                <a href="index.html" id="albumHomeLink">home</a>
            </div>

            <h1 id="albumHeading" class="album-view-heading"></h1>

            <!-- MUSIC: COUNTER AND NEXT BUTTON ONLY -->
            <div id="albumMusicControls" class="album-controls" hidden>
                <span id="songCounter" class="song-counter">1 / 12</span>
                <button id="nextSong" class="next-song" type="button">
                    next →
                </button>
            </div>

            <!-- PHOTOS AND NOTES -->
            <div id="diaryContainer"></div>

        </section>

    </main>

    <!-- FULLSCREEN PHOTO VIEWER -->
    <div id="photoLightbox" class="photo-lightbox" aria-hidden="true">
        <img id="lightboxImage" src="" alt="">
    </div>

    <script>
        // ================================================
        // BACKGROUND MUSIC
        // ================================================

        const musicKey = "birthdayBackgroundMusicTime";
        const backgroundMusic = new Audio("background.mp3");

        backgroundMusic.loop = true;
        backgroundMusic.preload = "auto";

        let backgroundStarted = false;

        function saveBackgroundPosition() {
            if (Number.isFinite(backgroundMusic.currentTime)) {
                sessionStorage.setItem(
                    musicKey,
                    String(backgroundMusic.currentTime)
                );
            }
        }

        function startBackgroundMusic() {
            if (backgroundStarted) {
                backgroundMusic.play().catch(() => {});
                return;
            }

            backgroundStarted = true;

            backgroundMusic.addEventListener("loadedmetadata", () => {
                const savedTime = Number(
                    sessionStorage.getItem(musicKey)
                );

                if (
                    Number.isFinite(savedTime) &&
                    savedTime >= 0 &&
                    Number.isFinite(backgroundMusic.duration) &&
                    backgroundMusic.duration > 0 &&
                    savedTime < backgroundMusic.duration
                ) {
                    backgroundMusic.currentTime = savedTime;
                }

                backgroundMusic.play().catch(() => {});
            }, { once: true });

            backgroundMusic.load();
        }

        backgroundMusic.addEventListener(
            "timeupdate",
            saveBackgroundPosition
        );

        window.addEventListener("pagehide", saveBackgroundPosition);

        function pauseBackgroundMusic() {
            saveBackgroundPosition();
            backgroundMusic.pause();
        }

        // ================================================
        // ALBUM DATA
        // ================================================

        const albums = {
            me: {
                title: "ME",

                photos: [
                    { src: "1.jpg", note: "(note here)" },
                    { src: "2.jpg", note: "(note here)" },
                    { src: "3.jpg", note: "(note here)" },
                    { src: "4.jpg", note: "(note here)" },
                    { src: "5.jpg", note: "(note here)" },
                    { src: "6.jpg", note: "(note here)" },
                    { src: "7.jpg", note: "(note here)" },
                    { src: "8.jpg", note: "(note here)" },
                    { src: "9.jpg", note: "(note here)" },
                    { src: "10.jpg", note: "(note here)" },
                    { src: "11.jpg", note: "(note here)" },
                    { src: "12.jpg", note: "(note here)" },
                    { src: "13.jpg", note: "(note here)" },
                    { src: "14.jpg", note: "(note here)" },
                    { src: "15.jpg", note: "(note here)" },
                    { src: "16.jpg", note: "(note here)" },
                    { src: "17.jpg", note: "(note here)" },
                    { src: "18.jpg", note: "(note here)" },
                    { src: "19.jpg", note: "(note here)" }
                ],

                playlist: [
                    "song1.mp3",
                    "Salem (instrumental).mp3",
                    "Jaden Smith - Fallen.mp3",
                    "yung bruh - vampiregoth u,__u.mp3",
                    "Molly Santana - Ecstasy (prod. psykidd x turro).mp3",
                    "Kanye West - Flashing Lights.mp3",
                    "Lil Uzi Vert - 13 Nuyork Nights At 21 (Produced By FKI).mp3",
                    "Lil Peep - Ghost Girl.mp3",
                    "Lil Peep - ghost boy.mp3",
                    "Kendrick Lamar - LOVE..mp3",
                    "Daniel Caesar - Get You ft Kali Uchis.mp3",
                    "Lil Peep - PRINCESS.mp3"
                ]
            },

            itsok: {
                title: "IT'S OK NOT TO BE OK",

                photos: [
                    { src: "itsok1.jpg", note: "(note here)" },
                    { src: "itsok2.jpg", note: "(note here)" },
                    { src: "itsok3.jpg", note: "(note here)" },
                    { src: "itsok4.jpg", note: "(note here)" },
                    { src: "itsok5.jpg", note: "(note here)" },
                    { src: "itsok6.jpg", note: "(note here)" },
                    { src: "itsok7.jpg", note: "(note here)" },
                    { src: "itsok8.jpg", note: "(note here)" },
                    { src: "itsok9.jpg", note: "(note here)" },
                    { src: "itsok10.jpg", note: "(note here)" },
                    { src: "itsok11.jpg", note: "(note here)" }
                ],

                playlist: [
                    "The Smashing Pumpkins - Luna [NIGHTCORE].mp3",
                    "MCR - Helena.mp3",
                    "MCR - Its Not a Fashion Statement Its a Deathwish.mp3",
                    "MCR - Im Not Okay I Promise.mp3",
                    "Shoebox Memories By Better Luck next time.mp3",
                    "MCR - Drowning Lessons.mp3"
                ]
            },

            beauty: {
                title: "BEAUTY",

                photos: [
                    { src: "beauty1.jpg", note: "(note here)" },
                    { src: "beauty2.jpg", note: "(note here)" },
                    { src: "beauty3.jpg", note: "(note here)" },
                    { src: "beauty4.jpg", note: "(note here)" },
                    { src: "beauty5.jpg", note: "(note here)" },
                    { src: "beauty6.jpg", note: "(note here)" },
                    { src: "beauty7.jpg", note: "(note here)" },
                    { src: "beauty8.jpg", note: "(note here)" },
                    { src: "beauty9.jpg", note: "(note here)" },
                    { src: "beauty10.jpg", note: "(note here)" },
                    { src: "beauty11.jpg", note: "(note here)" },
                    { src: "beauty12.jpg", note: "(note here)" },
                    { src: "beauty13.jpg", note: "(note here)" },
                    { src: "beauty14.jpg", note: "(note here)" },
                    { src: "beauty15.jpg", note: "(note here)" },
                    { src: "beauty16.jpg", note: "(note here)" },
                    { src: "beauty17.jpg", note: "(note here)" }
                ],

                playlist: [
                    "Aphex Twin - Iz Us [NIGHTCORE].mp3",
                    "slow sedation - neptune (sped up).mp3",
                    "doraemon shield.mp3"
                ]
            }
        };

        // ================================================
        // ALBUM RENDERING AND PLAYBACK
        // ================================================

        const albumHub = document.getElementById("albumHub");
        const albumView = document.getElementById("albumView");
        const albumHeading = document.getElementById("albumHeading");
        const diaryContainer = document.getElementById("diaryContainer");
        const albumMusicControls =
            document.getElementById("albumMusicControls");
        const songCounter = document.getElementById("songCounter");
        const nextSongButton = document.getElementById("nextSong");

        let currentAlbum = null;
        let currentTrackIndex = 0;

        const albumMusic = new Audio();
        albumMusic.preload = "auto";

        function updateSongCounter() {
            const playlist = albums[currentAlbum]?.playlist || [];

            if (playlist.length > 0) {
                songCounter.textContent =
                    (currentTrackIndex + 1) + " / " + playlist.length;
            }
        }

        function playCurrentTrack() {
            const playlist = albums[currentAlbum]?.playlist || [];

            if (!playlist.length) {
                albumMusic.pause();
                albumMusic.removeAttribute("src");
                albumMusicControls.hidden = true;
                return;
            }

            albumMusic.src = playlist[currentTrackIndex];
            albumMusic.load();

            updateSongCounter();
            albumMusicControls.hidden = false;

            albumMusic.play().catch(() => {
                // A click on "next" can retry if playback is blocked.
            });
        }

        function nextTrack() {
            const playlist = albums[currentAlbum]?.playlist || [];

            if (!playlist.length) return;

            currentTrackIndex =
                (currentTrackIndex + 1) % playlist.length;

            playCurrentTrack();
        }

        albumMusic.addEventListener("ended", nextTrack);
        nextSongButton.addEventListener("click", nextTrack);

        function renderAlbum(key) {
            const album = albums[key];

            diaryContainer.innerHTML = "";

            if (!album.photos.length) {
                const emptyMessage = document.createElement("p");
                emptyMessage.className = "empty-album";
                emptyMessage.textContent =
                    "photos and notes coming soon ♡";
                diaryContainer.appendChild(emptyMessage);
                return;
            }

            album.photos.forEach((photo) => {
                const entry = document.createElement("article");
                entry.className = "diary-entry";

                const image = document.createElement("img");
                image.className = "diary-photo";
                image.src = photo.src;
                image.alt = "";
                image.loading = "lazy";

                image.addEventListener("click", () => {
                    openLightbox(photo.src);
                });

                const note = document.createElement("div");
                note.className = "diary-note";
                note.textContent = photo.note;

                entry.appendChild(image);
                entry.appendChild(note);

                diaryContainer.appendChild(entry);
            });
        }

        function openAlbum(key) {
            currentAlbum = key;
            currentTrackIndex = 0;

            pauseBackgroundMusic();

            albumHub.style.display = "none";
            albumView.classList.add("active");

            albumHeading.textContent = albums[key].title;

            renderAlbum(key);
            playCurrentTrack();

            window.scrollTo(0, 0);
        }

        function returnToHub() {
            closeLightbox();

            albumMusic.pause();
            albumMusic.removeAttribute("src");
            albumMusic.load();

            currentAlbum = null;

            albumView.classList.remove("active");
            albumHub.style.display = "block";

            startBackgroundMusic();

            window.scrollTo(0, 0);
        }

        document.querySelectorAll("[data-album]").forEach((button) => {
            button.addEventListener("click", () => {
                openAlbum(button.dataset.album);
            });
        });

        document.getElementById("backToAlbums").addEventListener(
            "click",
            returnToHub
        );

        // ================================================
        // PHOTO LIGHTBOX
        // Click a photo to zoom; click outside or Escape to close.
        // ================================================

        const photoLightbox = document.getElementById("photoLightbox");
        const lightboxImage = document.getElementById("lightboxImage");

        function openLightbox(src) {
            lightboxImage.src = src;
            photoLightbox.classList.add("active");
            photoLightbox.setAttribute("aria-hidden", "false");
        }

        function closeLightbox() {
            photoLightbox.classList.remove("active");
            photoLightbox.setAttribute("aria-hidden", "true");
            lightboxImage.src = "";
        }

        photoLightbox.addEventListener("click", (event) => {
            if (
                event.target === photoLightbox ||
                event.target === lightboxImage
            ) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });

        // ================================================
        // HOME NAVIGATION
        // ================================================

        document.getElementById("homeLink").addEventListener(
            "click",
            saveBackgroundPosition
        );

        document.getElementById("albumHomeLink").addEventListener(
            "click",
            saveBackgroundPosition
        );

        // Start the background track when the gallery loads.
        startBackgroundMusic();
    </script>

</body>
</html>
