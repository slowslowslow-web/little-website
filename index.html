<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME BACKGROUND MUSIC ONLY -->
    <audio id="backgroundMusic" autoplay loop>
        <source src="background.mp3" type="audio/mpeg">
    </audio>


    <!-- THIN RUG BORDER -->

    <div class="rug top"></div>
    <div class="rug bottom"></div>
    <div class="rug left"></div>
    <div class="rug right"></div>


    <main class="page">

        <!-- SMALL SYMBOLS -->

        <div class="symbol eight">8</div>

        <!-- AIR SIGN / PAINT -->

        <a href="paint.html" class="symbol neptune">🜁</a>


        <!-- GALLERY -->

        <a href="gallery.html" class="floating-object album">

            <div class="pixel-camera">
                <div class="camera-lens"></div>
            </div>

            <span>open</span>

        </a>


        <!-- NOTES -->

        <a href="notes.html" class="floating-object note">

            <div class="pixel-note">
                <div></div>
                <div></div>
                <div></div>
            </div>

            <span>open</span>

        </a>


        <!-- SECRET -->

        <a href="secret.html" class="floating-object secret">

            <div class="pixel-eight">8</div>

            <span>...</span>

        </a>


        <!-- CENTER -->

        <section class="center">

            <div class="date">
                10 / 10
            </div>

            <h1>
                happy birthday :)
            </h1>

            <div class="infinity">
                ∞
            </div>

        </section>


        <div class="username">
            missmollysan
        </div>

    </main>


    <!-- AUTOPLAY FALLBACK -->

    <script>

        const music =
            document.getElementById("backgroundMusic");

        document.addEventListener("click", () => {

            if (music.paused) {
                music.play().catch(() => {});
            }

        }, { once: true });

    </script>

</body>

</html>
